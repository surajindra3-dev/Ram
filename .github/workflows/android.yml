
name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract FocusLock ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -q FocusLock_GitHub_APK_Project_Fixed.zip -d project
          test -f project/FocusLockGitHub_fixed/settings.gradle.kts
          echo "Project extracted successfully"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Check Gradle
        run: gradle --version

      - name: Build APK
        working-directory: project/FocusLockGitHub_fixed
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-debug-apk
          path: project/FocusLockGitHub_fixed/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
